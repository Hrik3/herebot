<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pipeline Dependency Viewer</title>
<style>
body {
    margin: 0;
    padding: 20px;
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
}

h2 {
    margin-top: 20px;
    margin-bottom: 20px;
}

#graph-container {
    width: 95%;
    height: 85vh;
    margin: 0 auto;
    background: #111827;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
}

#graph-svg {
    width: 100%;
    height: 100%;
    display: block;
}

.controls {
    margin: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}

button:hover {
    background: #1d4ed8;
}

button.reset {
    background: #dc2626;
}

button.reset:hover {
    background: #b91c1c;
}

input[type="range"] {
    width: 200px;
}

.stats {
    margin: 10px;
    font-size: 14px;
    color: #94a3b8;
}

.node {
    fill: #3b82f6;
    stroke: #1e40af;
    stroke-width: 2;
    cursor: pointer;
}

.node:hover {
    fill: #60a5fa;
}

.node-highlight {
    fill: #ef4444 !important;
    stroke: #dc2626 !important;
    stroke-width: 4 !important;
}

.node-selected {
    fill: #ef4444 !important;  /* Changed from green to red */
    stroke: #dc2626 !important;
    stroke-width: 4 !important;
}

.link {
    stroke: #94a3b8;
    stroke-width: 2;
    fill: none;
}

.link-highlight {
    stroke: #ef4444 !important;
    stroke-width: 3 !important;
}

.text {
    fill: white;
    font-family: 'Segoe UI';
    font-size: 12px;
    pointer-events: none;
}

.tooltip {
    position: absolute;
    padding: 10px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    border-radius: 5px;
    pointer-events: none;
    font-size: 12px;
    max-width: 300px;
    z-index: 100;
}
</style>
</head>
<body>

<h2>Pipeline Dependency Viewer (198 nodes, 295 edges)</h2>

<div class="controls">

    <button onclick="exportGraph()">Export SVG</button>
    <div>
        <label for="node-size">Node Size: </label>

    <div>
        <label for="link-distance">Link Distance: </label>
        <input type="range" id="link-distance" min="10" max="200" value="50" oninput="updateLinkDistance(this.value)">

</div>

<div id="graph-container">

let adjacency = {};
let selectedNode = null;
let simulation = null;
let isPhysicsRunning = true;

// Initialize graph
function initGraph() {
    const container = document.getElementById('graph-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    
    const svg = d3.select("#graph-svg")
        .attr("width", width)
        .attr("height", height);
    
    // Clear previous graph
    svg.selectAll("*").remove();
    
    // Create tooltip
    const tooltip = d3.select("#tooltip");
    
    // Build adjacency list
    buildAdjacency();
    
    // Create force simulation
    simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges)
            .id(d => d.id)
            .distance(50))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(30));
    
    // Create links
    const link = svg.append("g")
        .selectAll("line")
        .data(graphData.edges)
        .enter()
        .append("line")
        .attr("class", "link")
        .attr("id", d => `link-${d.source.id || d.source}-${d.target.id || d.target}`);
    
    // Create nodes
    const node = svg.append("g")
        .selectAll("circle")
        .data(graphData.nodes)
        .enter()
        .append("circle")
        .attr("class", "node")
        .attr("id", d => `node-${d.id}`)
        .attr("r", 8)
        .call(drag(simulation))
        .on("click", function(event, d) {
            event.stopPropagation();
            selectNode(d);
        })
        .on("mouseover", function(event, d) {
            tooltip.style("display", "block")
                .html(`<strong>${d.label || d.id}</strong><br>Type: ${d.type || 'node'}<br>ID: ${d.id}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", function() {
            tooltip.style("display", "none");
        });
    
    // Add labels
    const text = svg.append("g")
        .selectAll("text")
        .data(graphData.nodes)
        .enter()
        .append("text")
        .attr("class", "text")
        .text(d => d.label || d.id)
        .attr("font-size", "10px")
        .attr("dx", 12)
        .attr("dy", 4);
    
    // Update positions on simulation tick
    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);
        
        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);
        
        text
            .attr("x", d => d.x)
            .attr("y", d => d.y);
    });
    
    // Add zoom behavior
    const zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on("zoom", (event) => {
            svg.selectAll("g").attr("transform", event.transform);
        });
    
    svg.call(zoom);
    
    // Update stats
    updateStats();
}

function buildAdjacency() {
    adjacency = {};
    graphData.edges.forEach(edge => {
        const sourceId = edge.source.id || edge.source;
        const targetId = edge.target.id || edge.target;
        
        if (!adjacency[sourceId]) adjacency[sourceId] = [];
        adjacency[sourceId].push(targetId);
    });
    
    console.log("Adjacency list built with", Object.keys(adjacency).length, "source nodes");
}

function selectNode(node) {
    // If clicking the already selected node, deselect everything
    if (selectedNode && selectedNode.id === node.id) {
        clearAllHighlights();
        selectedNode = null;
        document.getElementById('selected-node').textContent = "Selected: None";
        return;
    }
    
    // Clear previous selection
    clearAllHighlights();
    
    // Set new selection
    selectedNode = node;
    
    // Find ALL connected nodes (including the selected one)
    const allRedNodes = getAllConnectedNodes(node.id);
    
    // Make ALL of them red
    allRedNodes.forEach(nodeId => {
        d3.select(`#node-${nodeId}`).classed("node-highlight", true);
    });
    
    // Also highlight all edges between these nodes
    highlightEdgesBetweenNodes(allRedNodes);
    
    document.getElementById('selected-node').textContent = `Selected: ${node.label || node.id} (${allRedNodes.size} nodes affected)`;
}

function getAllConnectedNodes(startNodeId) {
    const visited = new Set();
    const stack = [startNodeId];
    
    while (stack.length > 0) {
        const currentNodeId = stack.pop();
        
        if (visited.has(currentNodeId)) continue;
        visited.add(currentNodeId);
        
        // Find all nodes this node connects to
        if (adjacency[currentNodeId]) {
            adjacency[currentNodeId].forEach(targetId => {
                if (!visited.has(targetId)) {
                    stack.push(targetId);
                }
            });
        }
    }
    
    return visited;
}

function highlightEdgesBetweenNodes(nodeSet) {
    // Reset all edge highlights first
    d3.selectAll(".link-highlight").classed("link-highlight", false);
    
    // Highlight edges where both source and target are in the nodeSet
    graphData.edges.forEach(edge => {
        const sourceId = edge.source.id || edge.source;
        const targetId = edge.target.id || edge.target;
        
        if (nodeSet.has(sourceId) && nodeSet.has(targetId)) {
            d3.select(`#link-${sourceId}-${targetId}`).classed("link-highlight", true);
        }
    });
}

function clearAllHighlights() {
    d3.selectAll(".node-highlight").classed("node-highlight", false);
    d3.selectAll(".link-highlight").classed("link-highlight", false);
    d3.selectAll(".node-selected").classed("node-selected", false);
}
function resetGraph() {
    selectedNode = null;
    clearAllHighlights();
    document.getElementById('selected-node').textContent = "Selected: None";
    
    if (simulation) {
        simulation.alpha(1).restart();
    }
}

function togglePhysics() {
    isPhysicsRunning = !isPhysicsRunning;
    const button = document.getElementById('physics-btn');
    
    if (isPhysicsRunning) {
        simulation.alpha(1).restart();
        button.textContent = "Pause Physics";
    } else {
        simulation.stop();
        button.textContent = "Resume Physics";
    }
}

function zoomToFit() {
    const svg = d3.select("#graph-svg");
    svg.transition().duration(750).call(
        d3.zoom().transform,
        d3.zoomIdentity
    );
}

function updateNodeSize(size) {
    const radius = parseInt(size) * 2;
    d3.selectAll(".node").attr("r", radius);
}

function updateLinkDistance(distance) {
    if (simulation) {
        simulation.force("link").distance(parseInt(distance));
        simulation.alpha(1).restart();
    }
}

function updateStats() {
    document.getElementById('node-count').textContent = `Nodes: ${graphData.nodes.length}`;
    document.getElementById('edge-count').textContent = `Edges: ${graphData.edges.length}`;
}

function exportGraph() {
    const svg = document.getElementById('graph-svg');
    const serializer = new XMLSerializer();
    const source = serializer.serializeToString(svg);
    const blob = new Blob([source], {type: "image/svg+xml"});
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'graph-export.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// Drag behavior
function drag(simulation) {
    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }
    
    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }
    
    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }
    
    return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
}
